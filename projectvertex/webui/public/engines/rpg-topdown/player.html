<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redglitch RPG Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'VT323', monospace;
            overflow: hidden;
            color: #fff;
        }
        #game-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        .hidden { display: none !important; }
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 10000;
            color: #ff2d4d;
            font-size: 28px;
            letter-spacing: 3px;
        }
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; align-items: center; justify-content: center;
            z-index: 5000;
        }
        #main-menu {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; align-items: center; justify-content: center;
            z-index: 4000;
        }
        #death-screen, #overlay-screen, #pause-menu, #skill-selector-screen, #inventory-screen, #settings-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            z-index: 6000;
        }
        #interaction-hint {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff;
            z-index: 100;
        }
        button {
            background: #ff2d4d;
            border: none;
            color: #000;
            font-family: 'VT323', monospace;
            font-size: 20px;
            padding: 8px 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="loading-screen">LOADING WORLD...</div>

    <div id="login-screen" class="hidden">
        <div>
            <input type="text" id="username-input" placeholder="ENTER USERNAME" maxlength="16">
            <button id="login-btn" onclick="window.attemptLogin && window.attemptLogin()">START</button>
        </div>
    </div>

    <div id="main-menu" class="hidden"></div>

    <div id="death-screen" class="hidden">
        <div id="revive-count"></div>
        <div id="respawn-count"></div>
        <button id="btn-revive">Revive</button>
        <button id="btn-respawn">Respawn</button>
        <button id="btn-death-quit">Quit</button>
    </div>

    <div id="overlay-screen" class="hidden"></div>

    <div id="pause-menu" class="hidden">
        <div id="pause-main"></div>
        <div id="pause-options" class="hidden"></div>
    </div>

    <div id="skill-selector-screen" class="hidden"></div>
    <div id="inventory-screen" class="hidden"></div>
    <div id="settings-screen" class="hidden"></div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="interaction-hint" class="hidden"></div>
    </div>

    <audio id="menu-music" loop></audio>
    <button id="fullscreen-btn" class="hidden"></button>
    <button id="debug-iso-btn" class="hidden"></button>
    <button id="btn-save" class="hidden"></button>

    <!-- Shared systems (must load before engine scripts) -->
    <script src="/shared/LoggerHook.js"></script>
    <script src="/shared/EventBus.js"></script>
    <script src="/shared/AssetManager.js"></script>
    <script src="/shared/DialogueSystem.js"></script>
    <script src="/shared/QuestSystem.js"></script>
    <script src="/shared/LogicSystem.js"></script>
    <script src="/shared/UISystem.js"></script>
    <script src="/shared/UIRenderer.js"></script>
    <script src="/shared/LocalizationSystem.js"></script>
    <script src="/shared/SoundManager.js"></script>

    <!-- Engine dependencies -->
    <script src="sprites.js"></script>
    <script src="input.js"></script>
    <script src="saveSystem.js"></script>
    <script src="mapSystem.js"></script>
    <script src="/shared/AchievementSystem.js"></script>
    <script src="fxSystem.js"></script>
    <script src="audioSystem.js"></script>
    <script src="console.js"></script>
    <script src="campaignSystem.js"></script>
    <script src="spatialHash.js"></script>
    <script src="stateMachine.js"></script>
    <script src="BrainRuntime.js"></script>
    <script src="NPC.js"></script>
    <script src="MenuSystem.js"></script>
    <script src="Entities.js"></script>
    <script src="WeatherSystem.js"></script>
    <script src="Core.js"></script>

    <!-- Boots the engine via window.onload (auto-detects ?playtest=true) -->
    <script src="main.js"></script>
</body>
</html>
