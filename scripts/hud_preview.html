<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;background:#05070d;font-family:'Press Start 2P','VT323',monospace;color:#f4f7ff;display:flex;flex-direction:column;align-items:center}
#preview-stage{position:relative;width:960px;height:540px;margin:24px auto;background:
  repeating-linear-gradient(0deg,#0a0f1a 0 32px,#080c15 32px 64px),
  linear-gradient(180deg,#0a0f1a,#05070d);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.6);overflow:hidden;border-radius:4px}
#preview-root{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.2);
  width:800px;height:450px;--hud-void:#05070d;--hud-panel:#101723;--hud-panel2:#172033;--hud-red:#ff3147;--hud-gold:#ffd36a;--hud-cyan:#49e3ff;--hud-green:#62ff9a;--hud-violet:#b86cff;--hud-ink:#f4f7ff;
  font-family:'Press Start 2P','VT323',monospace;image-rendering:pixelated}
.hud-element{position:absolute;display:flex;align-items:center;border-radius:0;transition:none;image-rendering:pixelated}
.hud-element.hud-type-panel{background:rgba(20,24,38,.82);border:2px solid #000;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.10),inset -2px -2px 0 rgba(0,0,0,.45),3px 3px 0 rgba(0,0,0,.6)}
.hud-element.hud-type-label{text-shadow:2px 2px 0 #000;letter-spacing:1px}
.hud-element.hud-type-button{border:2px solid #000;background:rgba(20,24,38,.9);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.18),inset -2px -2px 0 rgba(0,0,0,.35),3px 3px 0 rgba(0,0,0,.6);text-transform:uppercase;letter-spacing:1px}
.hud-element.hud-type-bar{border:2px solid #000;background:#0b0d14;box-shadow:inset 2px 2px 0 rgba(0,0,0,.55),3px 3px 0 rgba(0,0,0,.6);overflow:hidden}
.hud-bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--bar-color);
  box-shadow:inset -3px 0 0 rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.3);
  image-rendering:pixelated;transition:width .18s steps(8)}
.hud-bar-ticks{position:absolute;inset:0;pointer-events:none;z-index:1}
.hud-bar-label{position:relative;z-index:2;width:100%;text-align:center;font-size:11px;text-shadow:2px 2px 0 #000}
.hud-element.hud-type-slot{background:#1b2030;border:2px solid #000;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.10),inset -2px -2px 0 rgba(0,0,0,.5),3px 3px 0 rgba(0,0,0,.6);image-rendering:pixelated}
.hud-element.hud-type-slot.is-active{border-color:#fff;box-shadow:inset 0 0 0 1px #fff,inset 2px 2px 0 rgba(255,255,255,.14),0 0 0 2px #fff,3px 3px 0 rgba(0,0,0,.6)}
.slot-key{position:absolute;top:2px;left:3px;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000;image-rendering:pixelated}
.hud-crt{position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.5;mix-blend-mode:multiply}
.hint{color:#8a93a8;font-family:monospace;font-size:12px;margin:8px 0 30px;text-align:center}
</style></head>
