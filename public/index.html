<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' http://localhost:3000 ws://localhost:3000 http://localhost:8000 ws://localhost:8000; img-src 'self' data:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redglitch Terminal // Puzzle Node</title>
    <script src="/ai/error-watcher.js"></script>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="fonts/fonts.css" rel="stylesheet">
    <style>
        :root {
            --bg: #080d1b;
            --panel: #040913;
            --line: rgba(106, 241, 194, 0.16);
            --text: #7af1c8;
            --dim: #4ec8a3;
            --warn: #ffd08a;
            --accent: #6fd9ff;
            --error: #ff8e8e;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% -20%, #162748 0%, var(--bg) 55%, #02050a 100%);
            color: var(--text);
            font-family: "VT323", monospace;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background-image: linear-gradient(transparent 95%, rgba(122, 241, 200, 0.09) 96%);
            background-size: 100% 4px;
            z-index: 1;
        }

        body::after {
            background: radial-gradient(circle at 15% 15%, rgba(111, 217, 255, 0.09), transparent 40%);
            z-index: 1;
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 2;
            opacity: 0.045;
            background-image: radial-gradient(circle, #ffffff 0.5px, transparent 0.6px);
            background-size: 3px 3px;
            pointer-events: none;
        }

        .layout {
            position: relative;
            z-index: 3;
            width: min(1050px, 94vw);
            margin: 18px auto;
            height: calc(100vh - 36px);
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(4, 9, 19, 0.92);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.56), inset 0 0 36px rgba(0, 0, 0, 0.55);
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            letter-spacing: 0.08rem;
            text-transform: uppercase;
        }

        .topbar strong {
            color: var(--accent);
            font-size: 1.25rem;
        }

        .chip {
            border: 1px solid rgba(111, 217, 255, 0.35);
            color: var(--accent);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        #terminal-output {
            margin: 0;
            padding: 14px 16px;
            overflow: auto;
            line-height: 1.28;
            font-size: 1.2rem;
            scrollbar-width: thin;
            white-space: pre-wrap;
        }

        .line {
            margin-bottom: 2px;
        }

        .line.dim {
            color: var(--dim);
        }

        .line.warn {
            color: var(--warn);
        }

        .line.error {
            color: var(--error);
        }

        .prompt {
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            background: rgba(0, 0, 0, 0.22);
        }

        .prompt-label {
            color: var(--accent);
            font-size: 1.15rem;
            white-space: nowrap;
        }

        #command-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font: inherit;
            font-size: 1.24rem;
            outline: none;
        }

        #quick-links {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 4;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-width: min(92vw, 560px);
        }

        #quick-links a {
            text-decoration: none;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.26);
            transition: border-color 0.15s ease;
        }

        #quick-links a:hover {
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="noise"></div>

    <main class="layout">
        <header class="topbar">
            <strong>Redglitch Puzzle Terminal</strong>
            <span class="chip" id="status-chip">locked</span>
        </header>

        <pre id="terminal-output" aria-live="polite"></pre>

        <div class="prompt">
            <span class="prompt-label">operator@redglitch:~$</span>
            <input id="command-input" type="text" autocomplete="off" spellcheck="false" placeholder="type help">
        </div>
    </main>

    <nav id="quick-links" aria-label="quick links">
        <a href="slot_selection.html">campaign</a>
        <a href="campaign_launcher.html">quick play</a>
        <a href="campaign_editor.html">editor</a>
        <a href="tools.html">tools</a>
        <a href="credits.html">credits</a>
    </nav>

    <script src="index-terminal.js"></script>
</body>
</html>
