<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG // AI PANEL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --rag-bg: #020b1c;
            --rag-panel: #051630;
            --rag-border: #00ff88;
            --rag-accent: #00ff88;
            --rag-text: #d0ffe8;
            --rag-font: 'VT323', monospace;
            --rag-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--rag-font);
            font-size: 18px;
            background: transparent !important;
            color: var(--rag-text);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
        }

        /* Interactive elements */
        #rag-container, #rag-search-panel, #rag-results-panel,
        #rag-mode-toggle, #rag-settings { pointer-events: auto !important; }

        /* === FLOATING RAG BUTTON === */
        #rag-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            pointer-events: auto;
        }

        #rag-btn {
            width: 96px;
            height: 96px;
            background: transparent;
            border: 2px solid var(--rag-accent);
            color: var(--rag-accent);
            font: bold 16px var(--rag-font);
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        #rag-btn:hover {
            background: var(--rag-accent);
            color: var(--rag-bg);
            box-shadow: var(--rag-shadow);
        }

        #rag-btn .rag-icon { font-size: 32px; line-height: 1; }
        #rag-btn .rag-label { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        #rag-btn.off { border-color: #666; color: #666; }

        /* === RAG SEARCH PANEL === */
        #rag-search-panel {
            position: fixed;
            bottom: 130px;
            left: 20px;
            width: 620px;
            height: 480px;
            background: var(--rag-bg);
            border: 2px solid var(--rag-accent);
            display: none;
            flex-direction: column;
            z-index: 9998;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.15);
            overflow: hidden;
        }

        #rag-search-panel.show { display: flex; }

        /* Header */
        #rag-header {
            background: var(--rag-accent);
            color: var(--rag-bg);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 2px 10px rgba(0, 255, 136, 0.35);
        }

        .rag-window-controls { display: flex; gap: 10px; }
        .rag-control-btn {
            background: transparent; border: none; color: var(--rag-bg);
            font: bold 22px var(--rag-font); cursor: pointer;
        }
        .rag-control-btn:hover { color: #fff; }

        /* Status strip */
        #rag-status {
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(0,0,0,0.3);
            padding: 3px 14px;
            display: flex;
            gap: 14px;
            font-size: 14px;
            color: rgba(2, 11, 28, 0.75);
        }
        #rag-status .rag-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        #rag-status .rag-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #033; box-shadow: 0 0 4px rgba(0,0,0,0.4); flex-shrink: 0;
        }
        #rag-status .rag-dot.ready { background: #003300; animation: ragPulse 1.2s infinite; }
        #rag-status .rag-dot.off { background: #330000; }

        /* Search area */
        #rag-search-area {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(0, 20, 46, 0.95), rgba(0, 12, 30, 0.98));
        }

        #rag-search-wrap {
            display: flex;
            gap: 8px;
            background: #000;
            border: 1px solid #333;
            border-radius: 0;
        }
        #rag-search-wrap:focus-within { border-color: var(--rag-accent); box-shadow: 0 0 10px rgba(0, 255, 136, 0.25); }

        #rag-search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--rag-accent);
            font-family: var(--rag-font);
            font-size: 18px;
            padding: 10px 12px;
            resize: none;
            outline: none;
        }

        #rag-search-btn {
            background: var(--rag-accent);
            color: var(--rag-bg);
            border: none;
            font: bold 18px var(--rag-font);
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #rag-search-btn:hover { background: #fff; box-shadow: 0 0 15px var(--rag-accent); }

        /* Filters */
        #rag-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .rag-filter-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            font-family: var(--rag-font);
            font-size: 14px;
            padding: 4px 10px;
            cursor: pointer;
        }
        .rag-filter-btn.active {
            border-color: var(--rag-accent);
            color: var(--rag-accent);
        }
        .rag-filter-btn:hover { border-color: var(--rag-accent); color: var(--rag-accent); }

        /* Results */
        #rag-results {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: var(--rag-font);
            position: relative;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(0,255,136,0.04), transparent 60%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.008) 0px, rgba(255,255,255,0.008) 1px, transparent 1px, transparent 3px);
        }

        #rag-results::before {
            content: 'R A G // READY FOR QUERY';
            position: absolute;
            left: 12px;
            bottom: 10px;
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(0, 255, 136, 0.12);
            pointer-events: none;
        }

        .rag-result {
            display: flex;
            gap: 8px;
            animation: ragFadeIn 0.2s;
            position: relative;
            padding: 8px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .rag-result:first-child { border-top: none; }

        .rag-result-avatar {
            flex-shrink: 0;
            width: 24px; height: 20px;
            margin-top: 2px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--rag-accent);
            border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: var(--rag-accent);
            text-shadow: 0 0 6px currentColor;
        }

        .rag-result-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .rag-result-name {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; color: #667; margin-bottom: 3px; letter-spacing: 1px; text-transform: uppercase;
        }
        .rag-result-time {
            font-size: 12px; color: #445; margin-left: auto; letter-spacing: 0; text-transform: none;
        }

        .rag-result-bubble {
            background: rgba(255,255,255,0.02);
            border: 1px solid #334455;
            border-left: 3px solid #334455;
            border-radius: 0 3px 3px 0;
            padding: 8px 12px;
            color: var(--rag-text);
            font-size: 17px;
            line-height: 1.4;
            position: relative;
            white-space: pre-wrap;
        }

        .rag-result-bubble .rag-cite {
            font-size: 11px; color: var(--rag-accent); margin-top: 6px;
            display: block; border-top: 1px dashed rgba(0,255,136,0.3); padding-top: 4px;
        }

        /* Empty state */
        #rag-empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: #555; font-size: 16px; text-align: center; padding: 40px;
        }
        #rag-empty .rag-empty-icon { font-size: 48px; margin-bottom: 12px; }

        /* Loading */
        #rag-loading {
            display: none;
            padding: 10px; font-size: 14px; color: var(--rag-accent);
            text-align: center; animation: ragPulse 1.5s infinite;
        }

        /* Animations */
        @keyframes ragFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes ragPulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* === MODE TOGGLE (top-right, small) === */
        #rag-mode-toggle {
            position: fixed;
            top: 60px;
            left: 12px;
            z-index: 2000002;
            padding: 6px 12px;
            border: 1px solid var(--rag-accent);
            background: #080c18;
            color: var(--rag-accent);
            font: 16px var(--rag-font);
            cursor: pointer;
            border-radius: 4px;
            box-shadow: var(--rag-shadow);
            display: none;
        }
        #rag-mode-toggle.off { color: #aaa; border-color: #666; }

    </style>
</head>
<body>
    <!-- RAG Mode toggle (shown when AI mode is easy/full) -->
    <div id="rag-mode-toggle" title="RAG AI Panel">RAG</div>

    <!-- Floating RAG button -->
    <div id="rag-container">
        <button id="rag-btn" class="off" onclick="window.RAGPanel ? RAGPanel.toggle() : null" title="RAG AI Panel - Aç/Kapa">
            <span class="rag-icon">🔍</span>
            <span class="rag-label">RAG</span>
        </button>
    </div>

    <!-- RAG Search Panel -->
    <div id="rag-search-panel">
        <div id="rag-header">
            <span id="rag-title">RAG // AI PANEL</span>
            <div class="rag-window-controls">
                <button class="rag-control-btn" onclick="window.RAGPanel ? RAGPanel.toggleSettings() : null" title="Ayarlar">[*]</button>
                <button class="rag-control-btn" onclick="window.RAGPanel ? RAGPanel.close() : null" title="Kapa">[X]</button>
            </div>
        </div>
        <div id="rag-status">
            <span class="rag-item"><span class="rag-dot ready" id="rag-status-dot"></span><span id="rag-status-text">RAG: READY</span></span>
            <span class="rag-item" id="rag-status-mode">MODE: --</span>
            <span class="rag-item" id="rag-status-chunks">CHUNKS: 0</span>
        </div>
        <div id="rag-search-area">
            <div id="rag-filters">
                <button class="rag-filter-btn active" id="rag-filter-all" data-filter="">HEPSİ</button>
                <button class="rag-filter-btn" id="rag-filter-docs" data-filter="docs">DOKÜMAN</button>
                <button class="rag-filter-btn" id="rag-filter-project" data-filter="project">PROJE</button>
                <span style="flex:1;"></span>
                <button class="rag-filter-btn" id="rag-btn-clear" onclick="window.RAGPanel ? RAGPanel.clearResults() : null" style="color:#e74c3c;">TEMİZLE</button>
            </div>
            <div id="rag-search-wrap">
                <textarea id="rag-search-input" rows="1" placeholder="RAG corpus'unda ara... (Enter = ara)" oninput="window.RAGPanel && window.RAGPanel.autoResize(this)"></textarea>
                <button id="rag-search-btn" onclick="window.RAGPanel ? RAGPanel.search() : null">ARA</button>
            </div>
            <div id="rag-loading">RAG ARAMA YAPILIYOR...</div>
            <div id="rag-results"></div>
        </div>
    </div>

    <!-- Core Shared Infra -->
    <script src="/shared/EventBus.js?v=7"></script>
    <script src="/shared/SharedProjectState.js?v=7"></script>

    <!-- AI mode gate -->
    <script type="module" src="../ai-mode.mjs?v=1"></script>

    <!-- RAG engine modules -->
    <script type="module" src="../rag-core.js?v=7"></script>
    <script type="module" src="../vector-store.js?v=7"></script>
    <script type="module" src="../embedding-provider.js?v=7"></script>
    <script type="module" src="../chunker.js?v=7"></script>
    <script type="module" src="../config.js?v=7"></script>
    <script type="module" src="../shim.js?v=7"></script>
    <script type="module" src="../rag-engine.js?v=7"></script>

    <!-- RAG Panel Controller -->
    <script type="module" src="ai-rag-panel.js?v=7"></script>

    <script>
        console.log('RAG // AI PANEL ONLINE');
    </script>
</body>
</html>
